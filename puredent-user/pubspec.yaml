name: puredent_app
description: PureDent Clinic — patient mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  bloc_concurrency: ^0.2.5

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.0

  # Routing
  go_router: ^14.6.2

  # DI
  get_it: ^8.0.2

  # Local storage / secure token storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  hive_flutter: ^1.1.0

  # Images — lazy loading, caching, memory-efficient decoding
  cached_network_image: ^3.4.1

  # Performance: lists
  visibility_detector: ^0.4.0+2

  # UI utilities
  flutter_svg: ^2.0.14
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_screenutil: ^5.9.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  logger: ^2.5.0
  jwt_decoder: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
